name: Generar JavaDoc

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ejecutar tests y generar JavaDoc
        working-directory: ./primerproyectomaven
        run: mvn test javadoc:javadoc

      - name: Copiar JavaDoc a /docs
        run: |
          rm -rf docs/*
          cp -r primerproyectomaven/target/site/apidocs/* docs/

      - name: Subir documentación actualizada
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: actualizar JavaDoc automaticamente" && git push)